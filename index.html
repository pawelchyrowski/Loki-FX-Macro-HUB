  --bg:#050907;--panel:rgba(10,19,15,.82);--ink:#EFEBDD;--ink2:#BDB8A6;--ink3:#8F9184;--line:rgba(217,179,91,.24);--chip:rgba(14,25,20,.88);
  --chipOn:#D9B35B;--chipOnInk:#1B1405;--chipOnInk2:#5A4513;--warn:#F0997B;--hl:rgba(217,179,91,.16);
  --gold:#D9B35B;--goldHi:#F6E3A6;--goldLo:#9A7430;--emerald:#2EE6A0;--goldInk:#1B1405;
  --ca:#2EE6A0;--cb:#F0C25B;
  --barrel:#0A100D;--barrel2:#17221C;--engrave:#EADFC0;--engrave2:#9A9A86;--index:#2EE6A0;
  --f2:#5B9BD5;--f4:#5FB474;--f56:#E2C044;--f8:#D9779F;--f11:#E58E3A;--f16:#9B86E0;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --sans:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Cinzel","Trajan Pro",Georgia,"Times New Roman",serif;
  color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
main{max-width:600px;margin:0 auto;padding:16px 16px 40px}
h1{font-family:var(--cond);font-weight:600;font-size:30px;line-height:1.05;margin:4px 0 2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sub{color:var(--ink2);font-size:14px;margin:0 0 12px}
h2{font-family:var(--cond);font-weight:500;font-size:21px;margin:24px 0 8px}
.ab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.side{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0}
.side.a.on{border-color:var(--ca)}.side.b.on{border-color:var(--cb)}
.tag{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px;min-width:0}
.tag span.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tag b{font-family:var(--cond);font-weight:600;font-size:17px;color:var(--ink)}
.sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.sw.a{background:var(--ca)}.sw.b{background:var(--cb)}
.side .n{font-family:var(--cond);font-weight:600;font-size:38px;line-height:1.05;margin-top:2px}
.side .l{font-size:12px;color:var(--ink2);margin-bottom:4px}
.lock{display:flex;align-items:center;gap:8px;margin:12px 2px 0;font-size:14px;color:var(--ink2);min-height:32px}
.lock input{width:20px;height:20px;accent-color:var(--gold)}
.edit{font-size:13px;color:var(--ink2);margin:6px 2px 0}
.frames{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.frame{background:var(--panel);border:2px solid var(--line);border-radius:12px;overflow:hidden}
.frame.a{border-color:var(--ca)}.frame.b{border-color:var(--cb)}
.frame svg{display:block;width:100%;height:auto}
.cap{font-size:12px;color:var(--ink2);margin:6px 2px 0}
.lensbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.lensbar::-webkit-scrollbar{display:none}
.lens{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:7px 11px;text-align:left;font:inherit;cursor:pointer;min-height:44px;max-width:220px}
.lens b{display:block;font-family:var(--cond);font-weight:500;font-size:17px;line-height:1.1}
.lens small{color:var(--ink3);font-size:12px}
.lens.on{background:var(--chipOn);color:var(--chipOnInk);border-color:var(--chipOn)}
.lens.on small{color:var(--chipOnInk2)}
.lens.add{border-style:dashed;color:var(--ink2)}
.barrel{background:var(--barrel);border-radius:14px;padding:10px 0 12px;margin:6px 0 4px;color:var(--engrave);overflow:hidden}
.barrel svg{display:block;width:100%;height:auto}

.kit small,.ci small,.pitem small{color:var(--ink3);display:block;font-size:12px}
.pitem .l{display:flex;align-items:center;gap:10px;min-width:0}
.pitem img{width:48px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:0 0 auto}
.pprev{display:block;width:100%;max-height:200px;object-fit:contain;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.catlist{max-height:360px;overflow-y:auto;margin-top:8px}
.grp{font-family:var(--cond);font-size:14px;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 2px}
.x{border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:8px;min-width:40px;min-height:40px;font:inherit;cursor:pointer;padding:0 10px}

.vt{display:flex;gap:6px;margin-top:14px}

.cmpLbl{position:absolute;bottom:8px;font:600 14px/1.2 var(--cond);padding:3px 9px;border-radius:6px;background:rgba(0,0,0,.66);color:#fff;pointer-events:none;max-width:47%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* One focus position p (0 = infinity setting of the lens, 1 = closest).
   mMain = lens magnification (tubes + focus), D = subject distance for the lens alone,
   a close-up filter of P diopters adds: m = mMain + (1 + mMain) * f * P / 1000, and the subject is at s = D / (1 + D * P / 1000) from the filter. */
function pt(L,f,e,P,p){
 const mb=mBase(L,f);const mMain=e/f+p*mb;const k=f*P/1000;const m=mMain+(1+mMain)*k;
 const D=mMain>0.0005?f*(1+1/mMain):Infinity;
 const s=P>0?(isFinite(D)?D/(1+D*P/1000):1000/P):D;
 return {mb,mMain,m,D,s,k};
}
function calc(U){
 const L=lensOf(U);const f=Math.min(L.fMax,Math.max(L.fMin,U.f));const e=sum(U.on),P=sum(U.fon);
 const q=pt(L,f,e,P,U.focus/100),lo=pt(L,f,e,P,0),hi=pt(L,f,e,P,1);
 const N=Math.max(U.N,L.N);const sen=sensorFor(L);
 let near,far;
 if(P>0){const tot=q.m>0.003?2*N*sen.c*(1+q.m)/(q.m*q.m):Infinity;near=Math.max(0,q.s-tot/2);far=q.s+tot/2;}
 else{const dr=dofRange(f,N,sen.c,q.D);near=dr.near;far=dr.far;}
 return {U,L,f,e,P,N,sen,m:q.m,mMain:q.mMain,s:q.s,D:q.D,mb:q.mb,lo,hi,loss:2*Math.log2(1+q.mMain),near,far,H:dofRange(f,N,sen.c,Infinity).H};
}
function fmtDist(mm){if(!isFinite(mm))return "∞";if(mm>=1000)return nf(mm/1000,mm>=10000?0:2)+" m";if(mm>=100)return nf(mm/10,0)+" cm";if(mm>=10)return nf(mm/10,1)+" cm";return nf(mm,1)+" mm";}
function fmtMag(m){if(!(m>0.002))return "–";return m>=1?nf(m,2)+"×":"1:"+nf(1/m,1);}
function subsets(arr){const out=[];const n=arr.length;for(let k=1;k<(1<<n);k++){let s=0,list=[];for(let i=0;i<n;i++)if(k&(1<<i)){s+=arr[i];list.push(arr[i]);}out.push({s,list});}return out.sort((a,b)=>a.s-b.s);}
const lensSub=L=>(L.fMin===L.fMax?L.fMin:L.fMin+"-"+L.fMax)+" mm f/"+nf(L.N)+(L.fmt==="DX"?", "+t("apsc"):"");
const grpName=g=>g==="van"?t("g_van"):g==="third"?t("g_third"):g;

const plus=P=>"+"+nf(P);
function accText(U){const parts=[];if(U.on.length)parts.push(t("tubeN",U.on.map(x=>nf(x)).join(" + ")));if(U.fon.length)parts.push(t("closeUpN",U.fon.map(plus).join(" ")));return parts.length?parts.join(" · "):t("plain");}

function normU(U,idx){
 if(!S.lenses.some(l=>l.id===U.sel))U.sel=S.lenses[Math.min(idx,S.lenses.length-1)].id;
 const L=lensOf(U);
 U.f=Math.min(L.fMax,Math.max(L.fMin,+U.f||L.fMax));
 U.on=(Array.isArray(U.on)?U.on:[]).filter(r=>S.rings.includes(r));
 U.fon=(Array.isArray(U.fon)?U.fon:[]).filter(r=>S.filters.includes(r));
 U.focus=+U.focus;if(!(U.focus>=0&&U.focus<=100))U.focus=100;
 U.N=Math.max(+U.N||5.6,L.N);
}
function normAll(){normU(S.A,0);normU(S.B,2);if(S.act!=="A"&&S.act!=="B")S.act="A";}

/* B follows A's framing: solve the focus position of B in closed form */
function lockSolve(){
 S.lockMsg=null;if(!S.lock)return;
 const cA=calc(S.A);const B=S.B;const L=lensOf(B);const f=Math.min(L.fMax,Math.max(L.fMin,B.f));const e=sum(B.on),P=sum(B.fon);
 const k=f*P/1000,mb=mBase(L,f);
 const mMain=(cA.m-k)/(1+k);const p=(mMain-e/f)/mb;
 if(isFinite(p)&&p>=-1e-6&&p<=1+1e-6){B.focus=Math.min(100,Math.max(0,p*100));return;}
 const lo=pt(L,f,e,P,0).m,hi=pt(L,f,e,P,1).m;
 B.focus=cA.m<lo?0:100;S.lockMsg=[fmtMag(lo),fmtMag(hi)];
}

function posFromS(c,s){
 const {f,e,P,mb}=c;let D;
 if(P>0){const sInf=1000/P;if(!isFinite(s)||s>=sInf-1e-9)D=Infinity;else D=s/(1-s*P/1000);}else D=s;
 let mMain;if(!isFinite(D))mMain=0;else{if(D<=f*1.0001)return null;mMain=f/(D-f);}
 return (mMain-e/f)/mb;
}

function curve(U){const L=lensOf(U);const f=Math.min(L.fMax,Math.max(L.fMin,U.f));const e=sum(U.on),P=sum(U.fon);const pts=[];
 for(let i=0;i<=48;i++){const q=pt(L,f,e,P,i/48);if(q.m>=0.02&&q.m<=4&&isFinite(q.s))pts.push([q.m,q.s/10]);}return pts;}

function sameFraming(c){
 const head=$("cmpHead"),tb=$("cmpTbl");
 if(!(c.m>0.002)){head.textContent=t("cmpNo");tb.innerHTML="";return;}
 const width=c.sen.w/c.m;head.textContent=t("cmpHead",fmtDist(width),S.act);
 const tubeSubs=[{s:0,list:[]}].concat(subsets(S.rings));const fOpts=[0].concat(S.filters);const res=[];
 S.lenses.forEach(B=>{const tgt=sensorFor(B).w/width;const focals=B.fMin===B.fMax?[B.fMin]:[B.fMax,Math.round((B.fMin+B.fMax)/2),B.fMin];let best=null;
  focals.forEach(f=>{const mb=mBase(B,f);
   tubeSubs.forEach(ts=>{const lo=ts.s/f,hi=lo+mb;
    fOpts.forEach(P=>{const k=f*P/1000;if(tgt<k)return;const mMain=(tgt-k)/(1+k);if(mMain<lo-1e-6||mMain>hi+1e-6)return;
     const D=mMain>0.0005?f*(1+1/mMain):Infinity;const s=P>0?(isFinite(D)?D/(1+D*P/1000):1000/P):D;
     if(!best||s>best.s)best={f,ts,P,s};});});});
  res.push({B,best,tgt});});
 const key=r=>r.best?(isFinite(r.best.s)?r.best.s:1e9):-1;
 res.sort((a,b)=>key(b)-key(a));
 tb.innerHTML="<thead><tr><th>"+esc(t("hLens"))+"</th><th>"+esc(t("hHow"))+"</th><th>"+esc(t("hDist"))+"</th></tr></thead><tbody>"+res.map(r=>{
  const cur=r.B.id===c.U.sel?' class="cur"':"";
  if(!r.best)return "<tr"+cur+"><td>"+esc(r.B.name)+"</td><td colspan=\"2\">"+esc(t("cant"))+"</td></tr>";
  const parts=[];if(r.B.fMin!==r.B.fMax)parts.push(r.best.f+" mm");if(r.best.ts.s)parts.push(t("tubeN",r.best.ts.list.map(x=>nf(x)).join(" + ")));if(r.best.P)parts.push(t("closeUpN",plus(r.best.P)));
  return "<tr"+cur+"><td>"+esc(r.B.name)+"<small>"+esc(fmtMag(r.tgt))+"</small></td><td>"+esc(parts.length?parts.join(" · "):t("plain"))+"</td><td>"+esc(fmtDist(r.best.s))+"</td></tr>";}).join("")+"</tbody>";
}

 $("bigMB").textContent=cB.m>0.002?fmtMag(cB.m):"∞";$("bigUB").textContent=isFinite(cB.s)?fmtDist(cB.s):"∞";

 drawFrame("frameA","capA",cA);drawFrame("frameB","capB",cB);drawFrame("frameA2",null,cA);drawFrame("frameB2",null,cB);drawScale(ca);
 $("lblA").textContent="A · "+fmtMag(cA.m)+" · "+fmtDist(cA.s);$("lblB").textContent="B · "+fmtMag(cB.m)+" · "+fmtDist(cB.s);
 $("framesSide").hidden=S.view!=="side";$("framesSlide").hidden=S.view!=="slide";

 $("vSide").setAttribute("aria-pressed",S.view==="side");$("vSlide").setAttribute("aria-pressed",S.view==="slide");
 setCmp(S.pos);
 $("focalOut").textContent=ca.f+" mm";$("ringOut").textContent=ca.e?t("tubesTotal",nf(ca.e)):t("none");$("filtOut").textContent=ca.P?t("filtersTotal",nf(ca.P)):t("noFilter");
 $("focusOut").textContent=isFinite(ca.s)?fmtDist(ca.s):"∞";$("apOut").textContent="f/"+nf(ca.N);
 const locked=S.lock&&S.act==="B";$("focus").disabled=locked;$("focus").value=U.focus;
 $("lockNote").textContent=S.lockMsg?t("lockMsg",S.lockMsg[0],S.lockMsg[1]):(locked?t("lockNote"):"");
 $("lockNote").className="note"+(S.lockMsg?" warn":"");
 renderSpec(cA,cB);
 const w=[];[["A",cA],["B",cB]].forEach(([k,c])=>{if((c.e>0||c.P>0)&&!c.L.ring&&c.e>0)w.push(t("wNoRing",k));if(c.e>0&&c.f<25)w.push(t("wShort",k));if(c.e>0&&c.P>0)w.push(t("wBoth",k));});
 if(cam().note)w.push(t("camNote"));
 $("warnNote").textContent=w.join(" ");$("warnNote").className="note"+(w.length?" warn":"");
 drawChart(cA,cB);sameFraming(ca);
}

 if(!name)return $("fErr").textContent=t("eName");

function readPhoto(f){
 const fr=new FileReader();
 fr.onerror=()=>{$("photoForm").hidden=false;$("pErr").textContent=t("ePhotoFmt");};
 fr.onload=()=>{const img=new Image();
  img.onload=()=>{const max=720;const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
   c.getContext("2d").drawImage(img,0,0,c.width,c.height);pend={src:c.toDataURL("image/jpeg",0.8),ar:c.height/c.width};openPhotoForm(f.name.replace(/\.[^.]+$/,""));};
  img.onerror=()=>{$("photoForm").hidden=false;$("pPrev").removeAttribute("src");$("pErr").textContent=t("ePhotoFmt");};
  img.src=fr.result;};
 fr.readAsDataURL(f);
}

function apply(d){
 if(!d||!Array.isArray(d.lenses)||!d.lenses.length)return;
 S.lenses=d.lenses;if(Array.isArray(d.rings))S.rings=d.rings;if(Array.isArray(d.filters))S.filters=d.filters;
 if(d.A&&d.B){S.A=Object.assign({sel:null,f:50,on:[],fon:[],focus:100,N:5.6},d.A);S.B=Object.assign({sel:null,f:50,on:[],fon:[],focus:100,N:5.6},d.B);}
 else{S.A=Object.assign({sel:null,f:50,on:[],fon:[],focus:100,N:5.6},{sel:d.sel,f:d.f,on:d.on||[],N:d.N||5.6});}
 if(d.act==="A"||d.act==="B")S.act=d.act;
 S.lock=!!d.lock;if(typeof d.bf0==="number")S.bFocus0=d.bf0;if(d.view==="slide"||d.view==="side")S.view=d.view;if(typeof d.pos==="number")S.pos=Math.min(100,Math.max(0,d.pos));if(CAMS.some(c=>c.id===d.cam))S.cam=d.cam;if(d.area==="FX"||d.area==="DX")S.area=d.area;
 if(OBJS.some(o=>o.id===d.obj))S.obj=d.obj;
 if(d.lang==="pl"||d.lang==="en")LANG=d.lang;
 normAll();
}
